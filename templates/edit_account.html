{% extends "base.html" %}

{% block title %}Edit Account | RAA Earthquake{% endblock %}

{% block content %}
<div class="breadcrumb"><a href="/">Home</a> <span>/</span> <a href="/account">Account</a> <span>/</span> <span>Edit</span></div>

<section class="section fade-in">
    <div class="auth-container">
        <div class="auth-card" style="max-width: 500px;">
            <h2>Edit Profile</h2>
            <p class="auth-sub">Update your account information below.</p>

            <form method="POST" action="/edit_account">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-input" value="{{ session.get('user_name', '') }}" placeholder="Your Name">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" value="{{ session.get('user_email', '') }}" disabled style="opacity: 0.7; cursor: not-allowed;">
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Email cannot be changed.</small>
                </div>

                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Leave blank to keep current">
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
                    <a href="/account" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

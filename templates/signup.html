{% extends "base.html" %}

{% block title %}Create Account — RAA Earthquake{% endblock %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 24px;">
            <div class="navbar-brand" style="justify-content: center; font-size: 1.5rem;">
                <div class="brand-icon" style="width: 48px; height: 48px; font-size: 24px;">🌍</div>
                <span>RAA Earthquake</span>
            </div>
        </div>
        
        <h2>Join RAA Earthquake</h2>
        <p class="auth-sub">Create your account to track seismic activity and stay informed about global events.</p>

        <form method="POST" action="/signup">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-input" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Create Password</label>
                <input type="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login" style="font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
